name: Testes

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r requirements-local.txt pytest==8.3.4 pytest-asyncio==0.25.2 httpx==0.28.1
      - name: Rodar os testes
        run: pytest -q
